<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Detalle del héroe</title>
</head>

<body>

<h1>Detalle del héroe</h1>

<h2 th:text="${hero.name}">
    Nombre del héroe
</h2>

<p>
    <strong>Clase:</strong>
    <span th:text="${hero.heroClass}"></span>
</p>

<p>
    <strong>Nivel:</strong>
    <span th:text="${hero.nivel}"></span>
</p>

<p>
    <strong>Experiencia:</strong>
    <span th:text="${hero.experience}"></span>
</p>

<h2>Misiones</h2>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Experiencia</th>
        <th>Estado</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="quest : ${hero.quests}">
        <td th:text="${quest.id}">1</td>

        <td th:text="${quest.title}">
            Título
        </td>

        <td th:text="${quest.experience}">
            0
        </td>

        <td>
            <span th:if="${quest.solved}">
                Resuelta
            </span>

            <span th:unless="${quest.solved}">
                Pendiente
            </span>
        </td>
    </tr>
    </tbody>
</table>

<p>
    <a href="/heroes">Volver a héroes</a>
</p>

<p>
    <a href="/quests">Ver misiones</a>
</p>

</body>
</html>
